name: CI
on: [push, pull_request]
jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Test a signed NSIS installer
        shell: pwsh
        run: |
          $env:MAKENSIS = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path $env:MAKENSIS)) { throw 'MakeNSIS was not found' }
          cargo test --locked -p veltrix signed_nsis_update_writes_only_to_chosen_installation -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p veltrix --test windows_e2e -- --ignored --test-threads=1
      - name: Build the Windows updater
        shell: pwsh
        run: |
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $fxc = Get-ChildItem $sdk -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'x64\fxc.exe') } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe was not found' }
          $env:GPUI_FXC_PATH = Join-Path $fxc.FullName 'x64\fxc.exe'
          cargo build --release --locked --bin veltrix
      - uses: actions/upload-artifact@v4
        with:
          name: veltrix-windows-x86_64
          path: target/release/veltrix.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo test --locked -p veltrix --test linux_e2e -- --ignored --test-threads=1
      - name: Build the Linux updater
        run: cargo build --release --locked --bin veltrix
      - uses: actions/upload-artifact@v4
        with:
          name: veltrix-linux-x86_64
          path: target/release/veltrix
          if-no-files-found: error


