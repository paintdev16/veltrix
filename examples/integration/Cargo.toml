[package]
name = "veltrix-integration-example"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
veltrix-core = { path = "../../crates/veltrix-core", version = "0.1.0" }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
gpui-kit = { version = "0.10.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
tempfile = "3"
